name: Release

on:
  push:
    branches:
      - main
  # Present on pull requests so the required "Release" check is always reported
  # on a candidate merge; publishing itself is gated to push events below.
  pull_request:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  preconditions:
    name: Release preconditions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      # OAA-2: a release may only proceed from the exact source commit whose
      # full CI is green. Frozen install — no npm resolution with a Bun lock.
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Full CI (lint, verify, typecheck, build, test)
        run: bun run check:all

  release:
    name: Release
    needs: preconditions
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # OAA-2: bind the release to the exact source SHA that passed CI.
      - name: Checkout source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Build publishable packages
        run: |
          set -euo pipefail
          bunx tsc -p packages/schema/tsconfig.json
          bunx tsc -p packages/core/tsconfig.json
          bunx tsc -p packages/adapters/tsconfig.json
          bunx tsc -p packages/passport/tsconfig.json

      # OAA-2: record the exact package tarball digests that are eligible for
      # publication, so the published artifacts are independently auditable.
      - name: Record package tarball digests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          : > package-digests.jsonl
          for dir in packages/schema packages/core packages/adapters packages/passport packages/cli; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              continue
            fi
            (cd "$dir" && npm pack --json --pack-destination "$RUNNER_TEMP/pack") \
              | jq -c '.[0] | {name, version, filename, integrity, shasum}' >> package-digests.jsonl
          done
          cat package-digests.jsonl

      - name: Upload package digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-digests-${{ github.sha }}
          path: package-digests.jsonl
          retention-days: 90

      - name: Create Release Pull Request or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          publish: bunx changeset publish
          title: "chore: release packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
