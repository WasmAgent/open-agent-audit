name: Deploy

# Deploys to Cloudflare Workers on every push to main.
#
# The deployment toolchain (wrangler) is an exact-pinned devDependency resolved
# from bun.lock — never installed at runtime inside the deploy step (R0.5).
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — API token with Workers:Edit, D1:Edit, R2:Edit, Queues:Edit
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#   CF_D1_DATABASE_ID     — D1 database ID for "oaa-meta"
#   CF_KV_PASSPORTS_ID   — KV namespace ID for "PASSPORTS"
#   CF_KV_APPROVALS_ID   — KV namespace ID for "APPROVALS"

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # wrangler 4.x requires Node.js >= 22 at deploy time (R0-TC-01).
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install all dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Build packages (schema → core → passport → adapters)
        run: |
          set -euo pipefail
          bunx tsc -p packages/schema/tsconfig.json
          bunx tsc -p packages/core/tsconfig.json
          bunx tsc -p packages/passport/tsconfig.json
          bunx tsc -p packages/adapters/tsconfig.json

      - name: Build dashboard
        run: bun run --cwd packages/dashboard build

      - name: Generate wrangler.jsonc
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_KV_PASSPORTS_ID: ${{ secrets.CF_KV_PASSPORTS_ID }}
          CF_KV_APPROVALS_ID: ${{ secrets.CF_KV_APPROVALS_ID }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os
          from datetime import datetime, timezone

          src = open("examples/cloudflare/wrangler.example.jsonc").read()
          d1_id = os.environ["CF_D1_DATABASE_ID"]
          kv_id = os.environ["CF_KV_PASSPORTS_ID"]
          kv_approvals_id = os.environ["CF_KV_APPROVALS_ID"]
          out = src.replace("REPLACE_ME_D1_ID", d1_id)
          out = out.replace("REPLACE_ME_KV_PASSPORTS_ID", kv_id)
          out = out.replace("REPLACE_ME_KV_APPROVALS_ID", kv_approvals_id)
          # R0 deployment identity — bind the deployed Worker to the exact
          # source SHA / repository / workflow run that produced it.
          out = out.replace("REPLACE_ME_BUILD_SHA", os.environ["BUILD_SHA"])
          out = out.replace("REPLACE_ME_BUILD_REPOSITORY", os.environ["BUILD_REPOSITORY"])
          out = out.replace("REPLACE_ME_BUILD_WORKFLOW_RUN", os.environ["BUILD_WORKFLOW_RUN"])
          out = out.replace(
              "REPLACE_ME_BUILD_TIMESTAMP",
              datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          )
          out = out.replace("REPLACE_ME_BUILD_PROFILE", "production")
          open("wrangler.jsonc", "w").write(out)
          print("wrangler.jsonc written")
          print(
              "build identity: %s @ %s (run %s)"
              % (os.environ["BUILD_SHA"], os.environ["BUILD_REPOSITORY"], os.environ["BUILD_WORKFLOW_RUN"])
          )
          # Sanity check — abort if placeholder still present
          if "REPLACE_ME" in out:
              raise SystemExit("ERROR: unreplaced placeholder in wrangler.jsonc")
          EOF

      # R0.5 deployment toolchain reproducibility: wrangler is an exact-pinned
      # devDependency. R0-TC-02 forbids any runtime install inside the deploy
      # step; R0-TC-01/04 prove package.json, bun.lock and the installed
      # binary all agree on the exact version before anything is deployed.
      - name: R0.5 — verify pinned deployment toolchain
        run: |
          set -euo pipefail
          wrangler_bin="./node_modules/.bin/wrangler"
          test -x "$wrangler_bin" || {
            echo "::error::wrangler binary missing from lockfile install (R0-TC-02)"; exit 1;
          }

          expected_wrangler="$(node -p "require('./package.json').devDependencies.wrangler")"
          lock_pin="wrangler@${expected_wrangler}"
          grep -Fq "\"${lock_pin}\"" bun.lock || {
            echo "::error::${lock_pin} not pinned in bun.lock (R0-TC-04)"; exit 1;
          }

          actual_wrangler="$("$wrangler_bin" --version)"
          echo "pinned wrangler: ${expected_wrangler}; installed binary reports: ${actual_wrangler}"
          test "$actual_wrangler" = "$expected_wrangler" || {
            echo "::error::installed wrangler ${actual_wrangler} != pinned ${expected_wrangler} (R0-TC-01)"; exit 1;
          }

          {
            echo "EXPECTED_WRANGLER=${expected_wrangler}"
            echo "LOCK_PIN=${lock_pin}"
            echo "DEPLOYED_WRANGLER_VERSION=${actual_wrangler}"
            echo "DEPLOYED_BUN_VERSION=$(bun --version)"
          } >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Direct lockfile binary — no wrangler-action, no runtime install.
          ./node_modules/.bin/wrangler deploy --config wrangler.jsonc 2>&1 | tee deploy-output.log

          # R0-TC-03: wrangler warning about fields it does not recognize means
          # the deploy tool silently ignored part of the intended configuration.
          if grep -Eiq 'unexpected field|unknown field|unrecognized field' deploy-output.log; then
            echo "::error::Wrangler reported unknown/unexpected config fields (R0-TC-03)"
            grep -Ein 'unexpected field|unknown field|unrecognized field' deploy-output.log
            exit 1
          fi

      # R0 deployment identity: a successful `wrangler deploy` is necessary but
      # insufficient. Probe the live production route and prove that the exact
      # SHA this workflow deployed is the revision actually serving. Any failed
      # assertion fails the deploy job. Override HEALTH_URL for non-standard
      # routes.
      - name: R0 — post-deploy live identity verification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          health_url="${HEALTH_URL:-https://trustavo.com/health}"
          deployment_target="${health_url#https://}"
          deployment_target="${deployment_target%%/*}"
          echo "R0: probing $health_url (expect sha $EXPECTED_SHA)"

          # Capture the live /health body. A failed probe leaves no file and the
          # verifier fails the job (R0-ID-03).
          rc=0
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors --max-time 15 \
            "$health_url" -o health.json || rc=$?
          echo "curl exit code: $rc"

          # Evaluates identity + toolchain verdicts, ALWAYS writes the
          # attestation artifact (evidence on failure too), and exits non-zero
          # on any failing verdict so the deploy job fails closed.
          bun packages/worker/scripts/verify-deployment.ts \
            --health-file health.json \
            --expect-sha "$EXPECTED_SHA" \
            --expect-repository "$EXPECTED_REPOSITORY" \
            --expect-workflow-run "$EXPECTED_WORKFLOW_RUN" \
            --deployment-target "$deployment_target" \
            --expect-wrangler "$EXPECTED_WRANGLER" \
            --lock-pin "$LOCK_PIN" \
            --wrangler-version "$DEPLOYED_WRANGLER_VERSION" \
            --wrangler-source locked \
            --bun-version "$DEPLOYED_BUN_VERSION" \
            --config-file wrangler.jsonc \
            --deploy-log deploy-output.log \
            --out runtime-deployment-attestation.json

      - name: R0 — upload runtime deployment attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-deployment-attestation
          path: runtime-deployment-attestation.json
          if-no-files-found: warn
