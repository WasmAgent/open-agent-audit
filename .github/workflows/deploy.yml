name: Deploy

# Deploys to Cloudflare Workers on every push to main.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — API token with Workers:Edit, D1:Edit, R2:Edit, Queues:Edit
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#   CF_D1_DATABASE_ID     — D1 database ID for "oaa-meta"
#   CF_KV_PASSPORTS_ID   — KV namespace ID for "PASSPORTS"
#   CF_KV_APPROVALS_ID   — KV namespace ID for "APPROVALS"

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install all dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Build packages (schema → core → passport → adapters)
        run: |
          set -euo pipefail
          bunx tsc -p packages/schema/tsconfig.json
          bunx tsc -p packages/core/tsconfig.json
          bunx tsc -p packages/passport/tsconfig.json
          bunx tsc -p packages/adapters/tsconfig.json

      - name: Build dashboard
        run: bun run --cwd packages/dashboard build

      - name: Generate wrangler.jsonc
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_KV_PASSPORTS_ID: ${{ secrets.CF_KV_PASSPORTS_ID }}
          CF_KV_APPROVALS_ID: ${{ secrets.CF_KV_APPROVALS_ID }}
        run: |
          python3 - <<'EOF'
          import os, re

          src = open("examples/cloudflare/wrangler.example.jsonc").read()
          d1_id = os.environ["CF_D1_DATABASE_ID"]
          kv_id = os.environ["CF_KV_PASSPORTS_ID"]
          kv_approvals_id = os.environ["CF_KV_APPROVALS_ID"]
          out = src.replace("REPLACE_ME_D1_ID", d1_id)
          out = out.replace("REPLACE_ME_KV_PASSPORTS_ID", kv_id)
          out = out.replace("REPLACE_ME_KV_APPROVALS_ID", kv_approvals_id)
          open("wrangler.jsonc", "w").write(out)
          print("wrangler.jsonc written")
          # Sanity check — abort if placeholder still present
          if "REPLACE_ME" in out:
              raise SystemExit("ERROR: unreplaced placeholder in wrangler.jsonc")
          EOF

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
