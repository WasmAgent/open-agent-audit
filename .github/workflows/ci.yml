name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  ci:
    name: Build, typecheck, verify, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      # OAA-1: the committed bun.lock is the single source of truth. Never mix
      # npm resolution with Bun lock semantics in required CI.
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      # lint + verify:all + typecheck + build + test (see package.json check:all)
      - name: Lint, verify, typecheck, build, test
        run: bun run check:all
