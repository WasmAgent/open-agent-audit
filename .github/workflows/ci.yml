name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  ci:
    name: Build, typecheck, verify, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: npm ci

      - name: Build packages (schema, core, adapters, passport)
        run: |
          npx tsc -p packages/schema/tsconfig.json
          npx tsc -p packages/core/tsconfig.json
          npx tsc -p packages/adapters/tsconfig.json
          npx tsc -p packages/passport/tsconfig.json

      - name: Typecheck CLI
        run: npx tsc -p packages/cli/tsconfig.json --noEmit

      - name: Typecheck worker
        run: npx tsc -p packages/worker/tsconfig.json --noEmit

      - name: Run verify scripts
        run: |
          node scripts/check-no-sensitive-info.mjs
          node scripts/verify-disclaimers.mjs

      - name: Run tests
        run: npm test --workspaces --if-present
