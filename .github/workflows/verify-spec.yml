name: Verify Spec

on:
  pull_request:
    paths:
      - 'spec/**'
      - 'schemas/**'
      - 'profiles/**'
      - 'docs/**'
      - 'rfcs/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  spec-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: node scripts/verify-disclaimers.mjs
      - run: node scripts/verify-evidence-ids.mjs
      - run: node scripts/verify-spec-consistency.mjs
